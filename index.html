<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Políticas de privacidad</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #555;
      --link: #0b57d0;
      --bg: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f0f0f0;
        --muted: #aaa;
        --link: #8ab4f8;
        --bg: #121212;
      }
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.55;
      color: var(--fg);
      background: var(--bg);
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    ul { padding-left: 1.25rem; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>Políticas de privacidad</h1>
    <p>Documentos públicos de las aplicaciones publicadas por Jorge Arellano Subías.</p>
    <ul>
      <li><a href="./tus-pasitos/">Tus Pasitos</a></li>
    </ul>
  </main>
</body>
</html>
